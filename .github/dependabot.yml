version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # pnpm refuses packages published in the last day, so give new releases time to settle
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      npm:
        update-types: [minor, patch]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /apps/bot
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      uv:
        update-types: [minor, patch]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker
    directories: [/apps/bot, /apps/web]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    ignore:
      # A new Python means bumping `requires-python` and `.python-version` too
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]
    groups:
      docker:
        patterns: ["*"]
      docker-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    ignore:
      # A Postgres major needs a dump and restore of the data volume
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: redis
        update-types: [version-update:semver-major]
    groups:
      compose:
        patterns: ["*"]
      compose-security:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
