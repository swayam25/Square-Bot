name: square

services:
  db:
    image: postgres:16-alpine
    container_name: square_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: youcannotpass
      POSTGRES_DB: square
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d square"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: square_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: ghcr.io/drizzle-team/gateway:latest@sha256:3f09490584ad97cb5fa6d2a7335b405b8ac96e3b17a427830930f4ff70fe3993
    container_name: square_gateway
    restart: unless-stopped
    user: "65532:65532"
    environment:
      DATABASE_URL_Square: postgresql://postgres:youcannotpass@db:5432/square
    ports:
      - "127.0.0.1:4983:4983"
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    # Connections are only read from the environment while /app is empty, so it never persists
    tmpfs:
      - /app:uid=65532,gid=65532
      - /tmp

volumes:
  postgres_data:
  redis_data:
