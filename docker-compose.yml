name: square

services:
  db:
    image: postgres:16-alpine
    container_name: square-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: youcannotpass
      POSTGRES_DB: square
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d square"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: square-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  storage:
    image: rustfs/rustfs:1.0.4@sha256:ed9210d6411d77ffceb70d94b964a3cb7d225983368bc25bebe01e995293dcc2
    container_name: square-storage
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: square
      RUSTFS_SECRET_KEY: youcannotpass
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: ""
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - storage_data:/data
    ulimits:
      nofile: 65536
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    image: ghcr.io/drizzle-team/gateway:latest@sha256:3f09490584ad97cb5fa6d2a7335b405b8ac96e3b17a427830930f4ff70fe3993
    container_name: square-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL_Square: postgresql://postgres:youcannotpass@db:5432/square
    ports:
      - "127.0.0.1:4983:4983"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - gateway_data:/app

volumes:
  postgres_data:
  redis_data:
  storage_data:
  gateway_data:
