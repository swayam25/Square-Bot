name: square

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  bot:
    build:
      context: .
      dockerfile: containers/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./.cache:/square/.cache
      - ./config.toml:/square/config.toml:ro
    logging: *logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: youcannotpass
      POSTGRES_DB: square
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d square"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

volumes:
  postgres_data:
